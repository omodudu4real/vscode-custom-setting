"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt: info on top, input on the bottom
add_newline = true
command_timeout = 500
palette = 'matugen'

format = """
[╭─](overlay)$username$directory$git_branch$git_state$git_metrics$git_status$nodejs$python$rust
[╰─](overlay)$character"""

# ---------------------------------------------------------
# Colors (this block is what Matugen can generate later)
# ---------------------------------------------------------
[palettes.matugen]
primary   = '#6fd3df' # Cyan — username accents, Node.js
secondary = '#b2cbd0' # Soft blue-gray — directory, Rust
tertiary  = '#b9c7ea' # Lavender — Git branch, Python
error     = '#ffb4ab' # Soft coral — errors, deleted files
text      = '#dbe4e6' # Light text
overlay   = '#899295' # Muted gray — prompt lines, time
success   = '#a6d189' # Soft green — additions, successful operations
warning   = '#e5c890' # Warm gold — modifications, merging
info      = '#83c5e4' # Light blue — Git information
git_bg    = '#29343a' # Muted dark blue-gray — Git status backgrounds


# ---------------------------------------------------------
# Segments
# ---------------------------------------------------------
[username]
show_always = true
style_user = 'bold primary'
style_root = 'bold error'
format = '[$user]($style)[:](overlay)'

[directory]
style = 'bold secondary'
format = '[$path]($style)[$read_only]($style) '
truncation_length = 3
truncation_symbol = '…/'
read_only = ' \uf023'

#######################
#   Version control   #
#######################

[git_branch]
symbol = "\ue0a0"
style = 'bold tertiary'
format = '[$symbol$branch]($style)'

[git_state]
format = '\($state( $progress_current of $progress_total)\) '
cherry_pick = '[🍒 PICKING](bg fg)'
rebase = '[ REBASING](bg fg)'
merge = '[ MERGING](bg fg)'
bisect = '[🔍 BISECTING](bg fg)'
am = '[AM](bg fg)'
am_or_rebase = '[AM/REBASE](bg fg)'
revert = '[󰕍 REVERTING](bg fg)'

[git_metrics]
added_style = "bg fg"
deleted_style = "bg fg"
format = '(+$added )(-$deleted )'
disabled = false

[git_status]
style = 'bold error'
conflicted = '󰞇 '
ahead = '󰶣${count}'
behind = '󰶡${count}'
diverged = '󰹹${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '${count}'
stashed = '󰏗${count}'
modified = '${count}'
staged = '󰐗${count}'
renamed = '󰁕${count}'
deleted = '󰆴${count}'
format = '($all_status$ahead_behind )'


[nodejs]
symbol = " "
style = 'bold primary'
format = '[$symbol($version)]($style) '

[python]
symbol = " "
style = 'bold tertiary'
format = '[$symbol($version )(\($virtualenv\))]($style) '

[rust]
symbol = " "
style = 'bold secondary'
format = '[$symbol($version)]($style) '

[character]
success_symbol = '[>](bold primary)'
error_symbol = '[>](bold error)'

[time]
disabled = false
time_format = '%H:%M'
style = 'overlay'
format = '[$time]($style)'
